name: Build — Godot Export & Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Export Web (HTML5) + Windows Desktop
  # ─────────────────────────────────────────────────────────────
  export:
    name: Export Godot Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot ${{ env.GODOT_VERSION }} binaries
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: |
            godot-bin/
            ~/.local/share/godot/export_templates/
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p godot-bin

          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          echo "⬇️  Downloading Godot ${GODOT_VERSION}..."
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${GODOT_FILE}.zip"
          unzip -q "${GODOT_FILE}.zip"
          mv "${GODOT_FILE}" godot-bin/godot
          chmod +x godot-bin/godot
          echo "✅ Godot binary ready"

      - name: Download export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          TEMPLATES_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "${TEMPLATES_DIR}"

          TEMPLATES_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          echo "⬇️  Downloading export templates..."
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TEMPLATES_FILE}"
          unzip -q "${TEMPLATES_FILE}" -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "${TEMPLATES_DIR}/"
          echo "✅ Export templates installed at ${TEMPLATES_DIR}"

      - name: Verify Godot binary
        run: |
          godot-bin/godot --version
          echo "✅ Godot binary verified"

      - name: Export — Web (HTML5)
        run: |
          set -euo pipefail
          mkdir -p build/web
          echo "🌐 Exporting to Web (HTML5)..."
          godot-bin/godot --headless --export-release "GuardianesLitoral" "$PWD/build/web/index.html" 2>&1
          echo ""
          echo "📦 Web export files:"
          ls -lh build/web/

      - name: Export — Windows Desktop
        run: |
          set -euo pipefail
          mkdir -p build/windows
          echo "🪟 Exporting to Windows Desktop..."
          godot-bin/godot --headless --export-release "Windows Desktop" "$PWD/build/windows/guardianes.exe" 2>&1
          echo ""
          echo "📦 Windows export files:"
          ls -lh build/windows/

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: html5-build
          path: build/web/
          retention-days: 7

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/guardianes.exe
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  Godot Export Complete"
          echo "  Godot : ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "════════════════════════════════════════"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy a GitHub Pages (solo en main)
  # Depende del job export — comparte el artifact html5-build
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: export
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: html5-build
          path: dist/

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  GitHub Pages Deploy Complete"
          echo "  URL: ${{ steps.deployment.outputs.page_url }}"
          echo "════════════════════════════════════════"
